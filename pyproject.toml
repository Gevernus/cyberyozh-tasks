[project]
name = "cyberyozh-tasks"
version = "1.0.0"
description = "Task management REST API on Django REST Framework"
requires-python = ">=3.12"

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "N", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
