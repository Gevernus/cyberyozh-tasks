# Only caddy is reachable from outside; web, db and redis talk over the compose network.
# Scale the API with `docker compose up -d --scale web=N`.

x-app: &app
  build: .
  env_file: .env
  environment: &app-environment
    DATABASE_URL: postgres://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tasks}
    REDIS_URL: redis://redis:6379/0
    # localhost: the container healthcheck calls http://localhost:8000.
    DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env},localhost,127.0.0.1
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Holds only throttle counters: no persistence, bounded memory.
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies migrations once per `up`, before any web replica starts.
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *app-environment
      DJANGO_DB_STATEMENT_TIMEOUT_MS: "0"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Longer than gunicorn's graceful_timeout so in-flight requests can finish.
    stop_grace_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_TLS: ${CADDY_TLS:-acme}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account. Never delete them (no `down -v`):
      # Let's Encrypt allows 5 certificates per domain set per week.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
