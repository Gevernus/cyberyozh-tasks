# Only caddy is reachable from outside; web, db and redis talk over the compose network.
# Scale the API with `docker compose up -d --scale web=N`.

# Docker keeps json-file logs forever by default; cap them per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-app: &app
  build: .
  logging: *logging
  env_file: .env
  environment: &app-environment
    DATABASE_URL: postgres://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tasks}
    REDIS_URL: redis://redis:6379/0
    # localhost: the container healthcheck calls http://localhost:8000.
    DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env},localhost,127.0.0.1
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # Holds only throttle counters: no persistence, bounded memory.
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies migrations once per `up`, before any web replica starts.
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *app-environment
      DJANGO_DB_STATEMENT_TIMEOUT_MS: "0"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Longer than gunicorn's graceful_timeout so in-flight requests can finish.
    stop_grace_period: 40s

  # Every refresh token issued stays in token_blacklist_outstandingtoken; expired ones
  # are deleted once a day. The query scans the table, hence no statement timeout.
  flush-tokens:
    <<: *app
    # A successful run touches a heartbeat file; a failed or hour-long run waits five minutes
    # before exiting so `restart` retries without hammering a database that is down.
    command:
      - sh
      - -c
      - >-
        while true; do
        if timeout 3600 python manage.py flushexpiredtokens; then touch /tmp/flushed; else sleep 300; exit 1; fi;
        sleep 86400;
        done
    environment:
      <<: *app-environment
      DJANGO_DB_STATEMENT_TIMEOUT_MS: "0"
    # Forwards SIGTERM to the shell, which as PID 1 would ignore it.
    init: true
    # Healthy while the last successful flush is under 25 hours old: a hung run turns the
    # service unhealthy. `up --wait` needs a healthcheck here (start_interval: Engine 25+).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/flushed -mmin -1500)\""]
      interval: 5m
      start_period: 2m
      start_interval: 2s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_TLS: ${CADDY_TLS:-acme}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account. Never delete them (no `down -v`):
      # Let's Encrypt allows 5 certificates per domain set per week.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
