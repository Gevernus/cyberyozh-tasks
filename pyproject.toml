[project]
name = "cyberyozh-tasks"
version = "1.0.0"
description = "Task management REST API on Django REST Framework"
requires-python = ">=3.12"

[tool.ruff]
line-length = 99
target-version = "py312"
# Generated by makemigrations; the hand-written migrations are linted.
extend-exclude = [
    "apps/accounts/migrations/0001_initial.py",
    "apps/tasks/migrations/0001_initial.py",
    "apps/tasks/migrations/0004_limit_text_length.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "N", "C4", "RUF"]
# Django/DRF declare configuration as mutable class attributes by design.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "core", "tests"]

[tool.bandit]
# Tests use asserts and fixed passwords by design.
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Tests run without collectstatic; WhiteNoise only warns about the missing folder.
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps", "config", "core"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
